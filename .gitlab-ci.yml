### Scripts ###
.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text
  - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name GitLabRegistry --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules: &rules
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - <<: *rule_tag
    when: manual
    allow_failure: true
  - <<: *rule_default_branch
    when: manual
    allow_failure: true
  - <<: *rule_mr
    when: manual
    allow_failure: true
  - <<: *rule_web
    when: manual
    allow_failure: true

### Defaults ###
variables:
  IMAGE_NAME: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  RUNNER_TAG: saas-linux-small-amd64

stages:
  - build
  - test
  - pack
  - publish

### CI Components ###
include:
  # Version calculation component - exports Version and PackageVersion variables
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.1.0
    inputs:
      rules: *rules
### CI Components ###
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@v2.7.2
    inputs:
      project: 'ViciOne.Core.Runtime.Analyzers.CI.slnf'
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
  ### Test & Build
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@v2.7.2
    inputs:
      project: 'ViciOne.Core.Runtime.Analyzers.CI.slnf'
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - echo "$Version"
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@v2.7.2
    inputs:
      project: 'ViciOne.Core.Runtime.Analyzers.CI.slnf'
      image: ${IMAGE_NAME}
      rules:
        - *rule_default_branch
        - *rule_mr
        - *rule_web
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      coverage: true
      tags:
        - ${RUNNER_TAG}
  ### NuGet Packages
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@v2.7.2
    inputs:
      project: 'ViciOne.Core.Runtime.Analyzers.CI.slnf'
      image: ${IMAGE_NAME}
      rules: *rules_manual
      before_script:
        - *activate_mise
        - 'echo "PackageVersion: ${PackageVersion:-notAssigned}"'
      tags:
        - ${RUNNER_TAG}
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@v2.7.2
    inputs:
      image: ${IMAGE_NAME}
      sources:
        - "JFrogViciOne"
        - "GitLabRegistry"
      rules: *rules_manual
      before_script:
        - *activate_mise
        - *update_nuget_source_rw
      tags:
        - ${RUNNER_TAG}