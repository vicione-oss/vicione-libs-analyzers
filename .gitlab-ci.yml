include:
  - project: 'acx/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0

Build:
  extends: .dotnet-build

xUnit:
  extends: .dotnet-test-xunit

Deploy NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/ViciOne.Core.Runtime.Analyzers.Package/ViciOne.Core.Runtime.Analyzers.Package.csproj'
    REPO: 'JFrogViciOne'

Release NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/ViciOne.Core.Runtime.Analyzers.Package/ViciOne.Core.Runtime.Analyzers.Package.csproj'
    REPO: 'JFrogViciOne'
